<!DOCTYPE html>
<head> 
    <meta charset="UTF-8">
        <title>Sam & Katelyn's Music Extravaganza</title>
        <link rel="stylesheet" type="text/css" 
            href="../static/webapp.css" />
        <script src="static/webapp.js"></script>
</head>
<body>
    <div id="musicPlayer">
        <h3>--MUSIC PLAYER--</h3>
    </div>

    <div id="siteHeader">
        <h2>Sam & Katelyn's Music Extravaganza</h2>
    </div>

    <div id="pageHeader">
        <span>
            <!--Normally blank element to fill with header contents-->
            <!--Like name of artist, name of album, etc.-->
            <h1>Paul Simon</h1>
        </span>
    </div>

    <div id="menu"></div>

    <div id="pageContents">
        <div class="playShuffleButtons">
            <button id="playButton">Play</button>
            <button id="shuffleButton">Shuffle</button>
        </div>
        <div id="pageData">
            <!--Blank element to take data inputs-->
            <!--Individual data items will be div objects of class "data"-->
            <!--Will be created and modified by the JavaScript file-->
            <table class="musicDataTable">
                <tr><td class="musicDataEntry"><p>Graceland</p></td></tr>
                <tr><td class="musicDataEntry"><p>So Beautiful or So What</p></td></tr>
                <tr><td class="musicDataEntry"><p>There Goes Rhymin' Simon</p></td></tr>
            </table>
        </div>
        
    </div>
</body>
